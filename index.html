.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;border-top:5px solid var(--c,var(--blue))}

.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:20px}
.bar{display:grid;grid-template-columns:110px 1fr 90px;gap:10px;align-items:center;margin:9px 0;font-size:.92rem}

.bar .t{background:#e6ebf4;border-radius:8px}.bar span:last-child{font-weight:700;color:var(--navy)}
.note{font-size:.85rem;color:var(--mute)}
.crumb{display:inline-block;margin:24px 0 0;font-weight:700}
.post{max-width:68ch}.post h3{margin-top:26px}.post p,.post li{margin:0 0 12px}
.tag{display:inline-block;background:var(--sun);color:#3a2a00;font-weight:700;font-size:.8rem;border-radius:5px;padding:1px 9px}

footer{border-top:1px solid var(--line);padding:28px 0;color:var(--mute);font-size:.9rem}
.chat{border:1px solid var(--line);border-radius:14px;background:var(--soft);max-width:760px;overflow:hidden}
.log{position:relative;max-height:480px;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px}
.msg{padding:12px 16px;border-radius:14px;max-width:92%;line-height:1.55;font-size:1rem}
.msg.bot{background:#fff;border:1px solid var(--line);align-self:flex-start}
.msg.me{background:var(--blue);color:#fff;align-self:flex-end}
.msg h3{margin:0 0 4px}.msg p{margin:0 0 8px}.msg ul{margin:0 0 8px}
.opts{display:flex;flex-wrap:wrap;gap:8px;padding:12px 16px;border-top:1px solid var(--line);background:#fff;min-height:58px}
.opts button{font:inherit;font-size:.95rem;font-weight:600;color:var(--navy);background:#fff;border:2px solid var(--blue);border-radius:99px;padding:8px 16px;cursor:pointer}

@media(max-width:700px){.hero{grid-template-columns:1fr;padding:28px 0}.bar{grid-template-columns:90px 1fr 74px}body{font-size:17px}}

{id:"web-works",t:"How the web works, from typing a URL to seeing a page",m:"6 min",b:`<p>Every time you open a website, a quick chain of events runs. Understanding it makes every later topic easier, because HTML, servers and databases are just parts of this chain.</p><h3>Step 1: DNS finds the address</h3><p>Computers find each other with numbers called IP addresses. Names like openlearn.org are easier to remember, so your device asks a DNS server to translate the name into an IP address, much like looking up a contact in a phone book.</p><h3>Step 2: The browser sends a request</h3><p>Your browser sends an HTTP request to that address. It says which page it wants, and sometimes sends extra data, such as a form you filled in. Secure sites use HTTPS, which encrypts the conversation so others cannot read it.</p><h3>Step 3: The server replies</h3><p>The server may run code, called the back end, and may read data from a database. It then sends back files: HTML for structure, CSS for appearance and JavaScript for behavior.</p><h3>Step 4: The browser draws the page</h3><p>The browser reads the HTML, applies the CSS and runs the JavaScript. This is the front end, the part users see and touch.</p><h3>Where you fit in</h3><ul><li>Front-end developers build what runs in the browser.</li><li>Back-end developers build the server logic and APIs.</li><li>Database skills connect both sides to stored data.</li></ul><p>A good exercise: open your browser's developer tools (F12), go to the Network tab and reload any page. You will see each request in this chain happening live.</p>`},
{id:"first-language",t:"Which programming language should you learn first?",m:"6 min",b:`<p>Beginners often lose weeks choosing a language. The honest answer is that the first language matters less than sticking with it, but your goal can guide the choice.</p><h3>If you want to build websites</h3><p>Start with HTML and CSS, then JavaScript. JavaScript is the only language that runs natively in every browser, so you will need it anyway.</p><h3>If you want data, automation or AI</h3><p>Choose Python. Its syntax reads almost like English, which lets you focus on ideas such as loops and functions instead of punctuation.</p><h3>If you want interview-ready problem solving</h3><p>Use the language you know best for data structures and algorithms. Python is popular because solutions are short. Java and C++ are also accepted by most companies.</p><h3>How to avoid common traps</h3><ul><li>Do not switch languages after two weeks. The concepts transfer, but you restart the learning curve.</li><li>Do not only watch videos. For every hour of lessons, spend an hour writing your own code.</li><li>Do not wait to feel ready. Build a tiny project in your first month.</li></ul><h3>A simple recommendation</h3><p>If you are unsure, learn Python first, then add SQL, then pick web development. That order gives you quick wins, job-relevant data skills and a clear path to full-stack work.</p>`},
{id:"sql-basics",t:"Why every developer should know SQL",m:"7 min",b:`<p>Almost every application stores data: users, orders, messages, scores. Relational databases hold much of that data, and SQL is the language used to ask them questions.</p><h3>The core idea</h3><p>A database is a set of tables, like spreadsheets with strict rules. Each row is one record and each column is one property. A key column, such as an ID, makes every row uniquely identifiable.</p><h3>The four moves you use every day</h3><ul><li><b>SELECT</b> reads data.</li><li><b>INSERT</b> adds a new row.</li><li><b>UPDATE</b> changes existing rows.</li><li><b>DELETE</b> removes rows.</li></ul><h3>Why JOINs matter</h3><p>Good designs split data into separate tables, such as students and courses, to avoid repeating information. A JOIN combines them again when you need a combined answer. This is the idea that makes SQL feel difficult at first and powerful later.</p><h3>Design habits worth learning early</h3><ul><li>Give every table a primary key.</li><li>Store each fact once, which is the heart of normalization.</li><li>Add indexes to columns you search often, since they make queries faster.</li></ul><h3>How to practice</h3><p>Install PostgreSQL or use SQLite, load a small dataset and write 30 queries that answer real questions. Free courses like CS50 SQL and SQLBolt guide you step by step.</p>`},
{id:"dsa-plan",t:"A realistic six-month plan to learn data structures and algorithms",m:"8 min",b:`<p>Data structures and algorithms (DSA) are how programmers organize data and solve problems efficiently. Many companies test them in interviews, so a steady plan pays off.</p><h3>Month 1: Foundations</h3><p>Learn Big-O notation, arrays and strings. Practice simple problems until loops and conditions feel natural.</p><h3>Month 2: Hashing, stacks and queues</h3><p>Hash maps solve a surprising number of problems by trading memory for speed. Stacks and queues teach you to think about order.</p><h3>Month 3: Recursion and sorting</h3><p>Recursion is hard at first. Trace small examples on paper until the call pattern clicks. Then learn merge sort, quick sort and binary search.</p><h3>Months 4 and 5: Trees and graphs</h3><p>Learn binary trees, search trees, heaps, breadth-first and depth-first search. These appear often in harder interviews.</p><h3>Month 6: Dynamic programming and mock interviews</h3><p>Start with simple patterns such as climbing stairs, then practice timed problems and explain your thinking out loud.</p><h3>Rules that make it work</h3><ul><li>Study 1 to 2 hours a day rather than a full day each weekend.</li><li>Before reading a solution, struggle with the problem for at least 20 minutes.</li><li>Keep a notebook of patterns, and redo problems you failed after a week.</li></ul><p>MIT's free 6.006 course on OpenCourseWare gives the theory, and CS50 gives a gentler start.</p>`}];

const say=(w,h)=>{const m=document.createElement("div");m.className="msg "+w;m.innerHTML=h;log.append(m);log.scrollTo({top:m.offsetTop-12,behavior:"smooth"})};
const ask=a=>{opts.innerHTML="";a.forEach(([l,f])=>{const b=document.createElement("button");b.textContent=l;b.onclick=()=>{say("me",l);opts.innerHTML="";setTimeout(f,250)};opts.append(b)})};
const start=()=>{say("bot","Hi! I'm your OpenLearn guide. I'll help you plan your 4 years of college. What do you want to become?");ask(Object.keys(T).map(k=>[T[k].n,()=>pick(k)]).concat([["I'm not sure yet",unsure]]))};
const unsure=()=>{say("bot","No problem. Most first-year students are unsure. Start with Python for 2 months, then follow what you enjoyed. Which sounds most fun?");ask([["Making websites",()=>pick("web")],["Working with data",()=>pick("data")],["Solving puzzles",()=>pick("swe")],["A bit of everything",()=>pick("full")]])};
const pick=k=>{say("bot","Great choice: <b>"+T[k].n+"</b>. This path combines "+T[k].k+". Here is the plan, one year at a time. Treat it as a guide and adjust it to your college syllabus.");year(k,0)};
const year=(k,n)=>{const y=T[k].y[n];say("bot","<h3>"+y.t+"</h3><p>"+y.g+"</p><ul class='ck'>"+y.i.map(x=>"<li>"+x+"</li>").join("")+"</ul><p><b>By the end of the year:</b> "+y.o+"</p><p>Free courses: "+y.c.map(c=>"<a href='#/course/"+c+"'>"+C[c].n+"</a>").join(", ")+"</p>");
const a=[];if(n<3)a.push(["Show Year "+(n+2)+" plan",()=>year(k,n+1)]);else say("bot","That is the full four-year plan. Want to compare another path?");
a.push(["Compare another path",()=>{say("bot","Which path do you want to see?");ask(Object.keys(T).filter(x=>x!=k).map(x=>[T[x].n,()=>pick(x)]))}],["Start over",start]);ask(a)};
start()}
function route(){const h=(location.hash||"#/").slice(2).split("/");const r=h[0];
$.innerHTML=r=="course"?course(h[1]):r=="courses"?courses():r=="blog"?(h[1]?post(h[1]):blog()):home();
if(!["course","courses","blog"].includes(r))initChat();
if(h[0]!=="res"){window.scrollTo(0,0);$.focus({preventScroll:true})}}
addEventListener("hashchange",route);route();
</script></body></html>
